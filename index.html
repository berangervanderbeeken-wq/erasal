<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Vanderbeeken Beranger">

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/header.css">
        <link rel="stylesheet" href="assets/css/main.css">
        <link rel="stylesheet" href="assets/css/footer.css">

        <script src="assets/js/script.js" defer></script>

        <link rel="icon" type="image/svg+xml" href="assets/images/logo-erasal.svg">
        <title>Erasal</title>
    </head>
    
    <body>        
        <header>    
        <button class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
            <a class="brand-logo">
                <img src="assets/images/logo-erasal.svg">
            </a>
            <nav class="navbar">
                <ul>
                    <li><a href="https://berangervanderbeeken-wq.github.io/erasal/">Home</a></li>
                    <li><a href="#socials">Contact</a></li>
                    <li><a href="#catalog">Shop</a></li>
                    <li><a href="#socials">Socials</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="hero">
                <div class="hero-heading">
                    <h1>Erasal</h1>
                    <p>Your board eraser, made smarter.</p>
                    <span></span>
                </div>
                <div class="img-wrapper">
                    <img class="animation-reveal" src="assets/images/product-render.png"> 
                </div>
            </section>
            <section class="products" id="catalog">
                <div class="products-heading">
                    <h2>Catalog</h2>
                    <p>We do not just sell products, we sell solutions.</p>
                    <span></span>
                </div>
                <div class="products__variants">
                    <!-- flipping card #1 -->
                    <div class="scene">
                        <div class="card">
                            <div class="card__face card__front">
                                <img src="assets/images/rect-render-front.png">
                            </div>
                            <div class="card__face card__back">
                                <div class="back__info">
                                    <p>Classic</p>
                                    <p>$8.99</p>
                                </div>
                                <img src="assets/images/rect-render-back.png">
                            </div>
                        </div>
                    </div>

                    <!-- flipping card #2-->
                    <div class="scene">
                        <div class="card">
                            <div class="card__face card__front">
                                <img src="assets/images/round-render-front.png">
                            </div>
                            <div class="card__face card__back">
                                <div class="back__info">
                                    <p>Deluxe</p>
                                    <p>$18.99</p>
                                </div>
                                <img src="assets/images/round-render-back.png">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="footer-heading">
                <img src="assets/images/logo-erasal.svg">
                <span></span>
                <p>Erasal<br>Skip the scrubbing<br>start the brainstorming</p>
            </div>
            <div class="socials" id="socials">
                <a><img src="assets/images/instagram-logo.svg"></a>
                <a><img src="assets/images/facebook-logo.svg"></a>
                <a><img src="assets/images/tiktok-logo.svg"></a>
                <p>mail:info@erasal.com</p>
            </div>
            <p class="copyright">&copy; 2026 Erasal Solutions. All rights reserved.</p>
        </footer>
    </body>
</html>
